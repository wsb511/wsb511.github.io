name: Refresh public RSS snapshots
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['rss/**', '.github/workflows/rss.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: rss-snapshots
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate both feeds
        id: fetch
        continue-on-error: true
        run: python rss/sync.py
      - name: Save successful snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rss/*.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Chinese RSS snapshots'
            git push
          fi
      - name: Publish GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
      - name: Report collection errors
        if: steps.fetch.outcome == 'failure'
        run: exit 1
