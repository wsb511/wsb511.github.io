name: Refresh public RSS snapshots
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: rss-snapshots
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RSS_SYNC_STATUS_FILE: /tmp/rss-sync-${{ github.run_id }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test publisher safeguards
        run: python -m unittest discover -s rss -p 'test_sync.py'
      - name: Fetch and validate four feeds
        id: fetch
        continue-on-error: true
        run: python rss/sync.py
      - name: Save successful snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Another writer can advance main after checkout. In that case,
          # discard the stale generated commit and re-collect on latest main.
          for attempt in 1 2 3; do
            git add rss/*.xml
            if git diff --cached --quiet; then
              echo 'RSS snapshots already current; no push needed.'
              break
            fi
            git commit -m 'Refresh Chinese RSS snapshots'
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Failed to publish after three attempts.' >&2
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            # Preserve healthy sources even if a different source still fails.
            python rss/sync.py || true
            sleep "$attempt"
          done
      - name: Publish GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
      - name: Report collection errors
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          status = json.loads(Path(os.environ['RSS_SYNC_STATUS_FILE']).read_text())
          if status['failed']:
              raise SystemExit('Old snapshots retained for: ' + ', '.join(status['failed']))
          PY

