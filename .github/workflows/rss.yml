name: Refresh public RSS snapshots
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['rss/**', '.github/workflows/rss.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: rss-snapshots
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate both feeds
        id: fetch
        continue-on-error: true
        run: python rss/sync.py
      - name: Save successful snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Another writer can advance main after checkout. In that case,
          # discard the stale generated commit and re-collect on latest main.
          for attempt in 1 2 3; do
            git add rss/*.xml
            if git diff --cached --quiet; then
              echo 'RSS snapshots already current; no push needed.'
              break
            fi
            git commit -m 'Refresh Chinese RSS snapshots'
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Failed to publish after three attempts.' >&2
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            python rss/sync.py
            sleep "$attempt"
          done
      - name: Publish GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
      - name: Report collection errors
        if: steps.fetch.outcome == 'failure'
        run: exit 1
